services:
  nginx-proxy:
    container_name: nginx-proxy
    image: nginxproxy/nginx-proxy:${NGINX_PROXY_TAG}
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    tty: true
    volumes:
      - ./nginx-proxy/nginx.conf:${NGINX_CONF}
      - ./nginx-proxy/cors.conf:${NGINX_PROXY_CORS_CONF}
      - html:${NGINX_HTML}
      - vhost:${NGINX_VHOST}
      - certs:${NGINX_CERTS}:ro
      - ${DOCKER_SOCK}:${TEMP_DOCKER_SOCK}:ro
    environment:
      - TRUST_DOWNSTREAM_PROXY
      - CORS_ALLOWED_DOMAIN
    networks:
      - internal
    # profiles: [$NGINX_PROXY_PROFILES]

  letsencrypt:
    container_name: letsencrypt
    image: nginxproxy/acme-companion:${ACME_COMPANION_TAG}
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    volumes_from:
      - nginx-proxy:rw
    volumes:
      - certs:${NGINX_CERTS}:rw
      - acme:${NGINX_ACME}
      - ${DOCKER_SOCK}:${DOCKER_SOCK}:ro
    environment:
      - ACME_CA_URI
      - CERTS_UPDATE_INTERVAL
      - DEFAULT_EMAIL
    networks:
      - internal
    # profiles: [$ACME_COMPANION_PROFILES]

  postgres:
    container_name: postgres
    restart: unless-stopped
    build:
      context: ./
      dockerfile: ./postgres/Dockerfile
      args:
        - POSTGRES_TAG
        - PGVECTOR_VERSION
        - LOAD_LANGUAGE
    tty: true
    volumes:
      - pg-data:${PGDATA}
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${POSTGRES_MAIN_USER}
      - POSTGRES_PASSWORD=${POSTGRES_MAIN_PASSWORD}
      - PGDATA
      - DB_USER
      - DB_PASSWORD
      - DB_TEMPLATE
      - UNACCENT_TEMPLATE
      - DB_USER_1
      - DB_PASSWORD_1
      - DB_USER_2
      - DB_PASSWORD_2
      - DB_USER_3
      - DB_PASSWORD_3
      - DB_USER_4
      - DB_PASSWORD_4
      - DB_USER_5
      - DB_PASSWORD_5
      - USE_PGADMIN
      - PGADMING_DB_NAME
      - PGADMING_DB_USER
      - PGADMIN_DB_PASSWORD
    networks:
      - internal
      - db
    ports:
      - 5436:5432
    # profiles: [$POSTGRES_PROFILES]

volumes:
  html:
  vhost:
  certs:
  acme:
  pg-data:

networks:
  internal:
    driver: bridge
    name: internal
  db:
    driver: bridge
    name: db
